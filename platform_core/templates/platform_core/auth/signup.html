{% load static %}
<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create student account · HOMIESX</title><link rel="stylesheet" href="{% static 'server.css' %}"><style>main{width:min(560px,calc(100% - 32px));margin:50px auto;padding:32px;background:var(--surface);border:1px solid var(--line)}form{display:grid;gap:10px}label{font-size:12px;font-weight:700}input,select{padding:12px;border:1px solid var(--line);font:inherit}.submit{margin-top:12px;padding:12px;border:0;background:var(--ink);color:var(--paper);font-weight:700}.errorlist,.error{color:#b44938;font-size:12px}.muted{color:var(--muted);font-size:13px}</style></head><body><main><p class="server-eyebrow">HOMIESX student access</p><h1>Create your space.</h1><p class="muted">Join the GHRCEMP student network for FY, SY, and TY learners.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% endfor %}<label for="course">Course / branch</label><input id="course" name="course" placeholder="Computer Engineering"><label for="year_of_study">Study year</label><select id="year_of_study" name="year_of_study"><option value="1">FY</option><option value="2">SY</option><option value="3">TY</option></select><button class="submit" type="submit">Create account →</button></form><p class="muted">Already registered? <a href="{% url 'student_login' %}">Log in</a></p></main></body></html>
