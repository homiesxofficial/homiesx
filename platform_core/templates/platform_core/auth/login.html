{% load static %}
<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student login · HOMIESX</title><link rel="stylesheet" href="{% static 'server.css' %}"><style>main{width:min(520px,calc(100% - 32px));margin:80px auto;padding:32px;background:var(--surface);border:1px solid var(--line)}form{display:grid;gap:10px}label{font-size:12px;font-weight:700}input{padding:12px;border:1px solid var(--line);font:inherit}.auth-actions{display:grid;gap:10px;margin:16px 0}.auth-actions a,.submit{display:block;text-align:center;padding:12px;text-decoration:none;border:1px solid var(--line);background:var(--ink);color:var(--paper);font-weight:700}.auth-actions a:first-child{background:#fff;color:#17221e}.error{color:#b44938;font-size:12px}.muted{color:var(--muted);font-size:13px}</style></head><body><main><p class="server-eyebrow">HOMIESX student access</p><h1>Welcome back.</h1><p class="muted">Log in to your GHRCEMP student space.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<div class="auth-actions"><a href="{% url 'social_login' provider='google' %}">Continue with Google</a><a href="{% url 'social_login' provider='github' %}">Continue with GitHub</a></div><p class="muted">or use your HOMIESX account</p><form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="username">Username or student email</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="submit" type="submit">Log in →</button></form><p class="muted">New student? <a href="{% url 'student_signup' %}">Create an account</a></p><a href="/">Back to HOMIESX</a></main></body></html>
